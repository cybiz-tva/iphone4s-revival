<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Open App Store</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="logo">O</span><div><h1>Open App Store</h1><p id="device">Built for your iPhone 4s</p></div></div><div class="search"><input id="search" placeholder="Search apps or publishers" type="search" aria-label="Search apps"></div></header>
<main id="main"><section class="intro"><span class="eyebrow">A small phone. More possibilities.</span><h2>Good apps, known sources.</h2><p>Compatible releases and your installed favorites, together in one place.</p><div class="pills"><span>iOS 9</span><span>32-bit</span><span>Data-partition installs</span></div></section><div id="filters"></div><div id="content"><p class="empty">Loading the local catalog…</p></div></main>
<div id="job" class="job hidden" role="status"><div class="jobtitle"><strong id="jobname"></strong><button id="cancel" onclick="OAS.command('cancel')">Cancel</button></div><p id="jobtext"></p><div class="track"><div id="bar"></div></div></div>
<nav><button id="tab-apps" class="selected" onclick="OAS.tab('apps')">Apps</button><button id="tab-installed" onclick="OAS.tab('installed')">Installed</button><button id="tab-sources" onclick="OAS.tab('sources')">Sources</button><button id="tab-about" onclick="OAS.tab('about')">About</button></nav>
<script src="app.js"></script></body></html>
